[package]
name         = "opentelemetry_resourcedetector_gcp_rust"
version      = "0.21.0"
description  = "This library provides support for detecting GCP resources like GCE, GKE, etc."
homepage     = "https://github.com/Sergo007/opentelemetry-resourcedetector-gcp-rust"
repository   = "https://github.com/Sergo007/opentelemetry-resourcedetector-gcp-rust"
keywords     = ["detector", "gcp", "opentelemetry", "resource"]
authors      = ["Serhii <yatsyna.sergey@gmail.com>"]
readme       = "README.md"
license      = "Apache-2.0"
edition      = "2021"
rust-version = "1.85"

[dependencies]
reqwest           = { version = "0.13.3", default-features = false, features = ["json"] }
serde             = { version = "1.0", features = ["derive"] }
serde_json        = "1.0"
tracing           = "0.1"
opentelemetry     = { version = "0.31", features = ["metrics"] }
opentelemetry_sdk = { version = "0.31", features = ["metrics"] }
regex             = "1.12.3"
once_cell         = "1.21.4"

[dev-dependencies]
pretty_assertions        = "1.4.1"
pretty_assertions_sorted = "1.2.3"

[features]
default                = ["rustls-tls-aws-lc"]
native-tls             = ["reqwest/native-tls"]
rustls-tls-aws-lc      = ["reqwest/rustls"]
rustls-tls-no-provider = ["reqwest/rustls-no-provider"]
